<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLC Fencing | Instant Online Fence Estimates | Rincon & Savannah GA</title>
  <meta name="description" content="Get an instant online fence estimate in seconds. GLC Fencing serves Rincon, Pooler, Savannah, and Effingham County with quality wood, vinyl, chain link, and aluminum fencing.">
  <meta name="keywords" content="fence contractor Rincon GA, fence installation Savannah, instant fence quote, wood fence, vinyl privacy fence, Effingham county fencing">
  
  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="GLC Fencing | Instant Online Fence Cost Calculator">
  <meta property="og:description" content="Draw your fence line on our satellite map and get an instant pricing estimate in seconds.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://glcga.com">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Local Business Structured Data (Schema.org) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FenceContractor",
    "name": "GLC Fencing",
    "url": "https://glcga.com",
    "email": "Glcga19@gmail.com",
    "areaServed": [
      { "@type": "City", "name": "Rincon" },
      { "@type": "City", "name": "Pooler" },
      { "@type": "City", "name": "Savannah" },
      { "@type": "AdministrativeArea", "name": "Effingham County" }
    ],
    "priceRange": "$$"
  }
  </script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">

  <header class="bg-slate-900 text-white p-4 shadow-md">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">GLC Fencing</h1>
      <span class="text-sm bg-slate-800 px-3 py-1 rounded-full text-slate-300">Instant Online Estimator</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto w-full p-4 flex-grow space-y-6">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <label for="search-box" class="block text-sm font-semibold text-gray-700 mb-1">Search Property Address</label>
      <input id="search-box" type="text" placeholder="Enter street address..." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
    </div>

    <div class="relative bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div id="map" class="w-full h-96"></div>
      <div class="absolute bottom-3 left-3 right-3 bg-slate-900/90 text-white p-3 rounded-lg backdrop-blur-sm flex justify-between items-center text-sm">
        <div>
          <span>Estimated Footage: </span>
          <strong id="footage-display" class="text-emerald-400 text-base">0</strong> ft
        </div>
        <div class="space-x-2">
          <button onclick="undoLastPoint()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-md text-xs font-medium transition">Undo</button>
          <button onclick="clearMap()" class="bg-red-600/80 hover:bg-red-600 text-white px-3 py-1.5 rounded-md text-xs font-medium transition">Clear</button>
        </div>
      </div>
    </div>

    <div id="form-container" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
      <h2 class="text-lg font-bold text-gray-800 border-b pb-2">Fence Options & Contact Information</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="material-select" class="block text-sm font-medium text-gray-700 mb-1">Material Type</label>
          <select id="material-select" class="w-full p-2.5 border border-gray-300 rounded-lg">
            <option value="wood_privacy">Wood Privacy</option>
            <option value="wood_semi_privacy">Wood Semi-Privacy</option>
            <option value="wood_board_on_board">Wood Board on Board</option>
            <option value="vinyl_privacy">Vinyl Privacy</option>
            <option value="chain_link">Chain Link</option>
            <option value="ornamental_aluminum">Ornamental Aluminum</option>
          </select>
        </div>

        <div>
          <label for="height-select" class="block text-sm font-medium text-gray-700 mb-1">Fence Height</label>
          <select id="height-select" class="w-full p-2.5 border border-gray-300 rounded-lg">
            <option value="1.0">4 Feet</option>
            <option value="1.15" selected>6 Feet</option>
            <option value="1.30">8 Feet</option>
          </select>
        </div>

        <div>
          <label for="single-gate-select" class="block text-sm font-medium text-gray-700 mb-1">Single Gates (Walk-through)</label>
          <select id="single-gate-select" class="w-full p-2.5 border border-gray-300 rounded-lg">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>

        <div>
          <label for="double-gate-select" class="block text-sm font-medium text-gray-700 mb-1">Double Gates (Drive-through)</label>
          <select id="double-gate-select" class="w-full p-2.5 border border-gray-300 rounded-lg">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </div>
      </div>

      <div class="pt-2 border-t space-y-3">
        <div>
          <label for="lead-name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input id="lead-name" type="text" required placeholder="John Doe" class="w-full p-2.5 border border-gray-300 rounded-lg">
        </div>
        <div>
          <label for="lead-phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
          <input id="lead-phone" type="tel" required placeholder="(912) 555-0199" class="w-full p-2.5 border border-gray-300 rounded-lg">
        </div>
        <div>
          <label for="lead-email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
          <input id="lead-email" type="email" required placeholder="john@example.com" class="w-full p-2.5 border border-gray-300 rounded-lg">
        </div>
      </div>

      <button onclick="submitLead()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-lg shadow transition">
        Calculate Estimate & Submit
      </button>
    </div>

    <div id="result-container" class="hidden bg-emerald-50 border border-emerald-200 p-6 rounded-xl text-center space-y-3">
      <h2 class="text-xl font-bold text-emerald-900">Your Estimated Price Range</h2>
      <div id="price-display" class="text-3xl font-black text-emerald-700"></div>
      <p class="text-sm text-emerald-800">Thank you! We have received your project details and will follow up with you shortly.</p>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDigtiw69XtU_EC1ke5cUJLtEUBQSTi9CE&libraries=places,geometry&callback=initMap" async defer></script>
</body>
</html>
